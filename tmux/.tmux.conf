##### 终端与颜色（通用且稳） #####
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'   # 让真彩生效
set -s set-clipboard on
set -g history-limit 20000
setw -g mode-keys emacs
set -g allow-rename off
set -g bell-action none

##### 鼠标与滚轮（接近普通终端行为） #####
set -g mouse on
# 向上滚轮：不在 copy-mode 就进入（便于查看历史/选择）
bind -T root WheelUpPane if -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'
# 向下滚轮：在 copy-mode 中正常向下滚动，而不是直接退出
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
# 鼠标选择：复制后退出 copy-mode，让键盘输入回到 shell
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
# 双击/三击选词/选行并复制，然后回到 shell
bind -n DoubleClick1Pane select-pane \; copy-mode -H \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel
bind -n TripleClick1Pane select-pane \; copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel

##### 简洁状态栏（不花哨） #####
set -g status-interval 5
set -g status-style bg=colour237,fg=white,bold
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=colour82
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[bold,fg=cyan]#I:#W#F#[default]'
set -g status-left  '#[fg=green]#S#[default]'
set -g status-right '#[fg=yellow]#H #[fg=white]%Y-%m-%d %H:%M#[default]'

##### 快捷键增强（实用、不改变 prefix） #####
unbind '"'
unbind %
bind - split-window -v
bind | split-window -h
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

##### SSH/VSCode 细节 #####
set -g update-environment 'DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_RUNTIME_DIR VSCODE_IPC_HOOK_CLI'

##### 插件列表（保留你原有） #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##### resurrect/continuum 建议 #####
# 保存 pane 内容（历史）以便恢复后还能翻滚
set -g @resurrect-capture-pane-contents 'on'
# 自动保存间隔（分钟）
set -g @continuum-save-interval '5'
# 启动 tmux 时自动恢复
set -g @continuum-restore 'on'

##### 必须放在最后 #####
if-shell '[ -r "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
